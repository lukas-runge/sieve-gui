name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Svelte type check
        run: pnpm check

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: ManageSieve tests against Dovecot
        run: |
          crates/managesieve/tests/dovecot/gen-certs.sh
          docker compose -f crates/managesieve/tests/dovecot/compose.yaml up -d --build
          timeout 60 sh -c 'until nc -z localhost 14190; do sleep 1; done'
          MANAGESIEVE_TEST_ADDR=localhost:14190 MANAGESIEVE_TEST_TLS_ADDR=localhost:14191 \
            cargo test -p managesieve --test dovecot
          docker compose -f crates/managesieve/tests/dovecot/compose.yaml down

      - name: Parser tests against the Pigeonhole test suite
        run: |
          scripts/fetch-pigeonhole.sh
          PIGEONHOLE_DIR=target/pigeonhole cargo test -p sieve-core --test pigeonhole -- --ignored
