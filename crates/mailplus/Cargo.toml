[package]
name = "mailplus"
description = "Synology MailPlus labels through DSM's web API"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[dependencies]
managesieve = { version = "0.1.0", path = "../managesieve" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

