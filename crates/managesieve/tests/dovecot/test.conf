# Test-only overrides for the official dovecot/dovecot image.
# Loaded after the image's own conf.d/*.conf files.

# Allow PLAIN/LOGIN over the plaintext listener so `Security::Insecure`
# can be exercised. Never do this in production.
auth_allow_cleartext = yes
auth_mechanisms = plain login

ssl = yes
ssl_server {
  cert_file = /etc/dovecot/test-certs/tls.crt
  key_file = /etc/dovecot/test-certs/tls.key
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Small quotas so HAVESPACE / quota responses can be tested.
sieve_quota_script_count = 20
sieve_quota_storage_size = 1M
sieve_max_script_size = 256k

service managesieve-login {
  # Implicit TLS listener (non-standard, but useful for testing).
  inet_listener sieves {
    port = 35190
    ssl = yes
  }
}
