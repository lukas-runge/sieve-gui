# cargo-deny: licenses, advisories and sources of all Rust dependencies
# (concept §10). Run with `cargo deny check`.

[graph]
all-features = true

[licenses]
# Permissive licenses only. MPL-2.0 is file-level copyleft and allowed for
# unmodified dependencies (cssparser, selectors, option-ext come via Tauri).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
# Tauri pulls in several versions of some crates; not worth failing over.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
ignore = [
    # proc-macro-error is unmaintained; it only comes in through Tauri's GTK3
    # bindings on Linux (glib-macros) and runs at compile time.
    { id = "RUSTSEC-2024-0370", reason = "transitive via Tauri's gtk-rs 0.18 on Linux" },
]
