[package]
name = "sieve-gui"
version = "0.1.0"
description = "A desktop editor for server-side Sieve mail filters via ManageSieve"
authors = ["Lukas Runge"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sieve_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sieve-core = { path = "../crates/sieve-core" }
managesieve = { version = "0.1.0", path = "../crates/managesieve" }
keyring = "4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
mailstore = { version = "0.1.0", path = "../crates/mailstore" }
