[package]
name = "sieve-gui"
version = "0.1.0"
description = "A desktop editor for server-side Sieve mail filters via ManageSieve"
authors = ["Lukas Runge"]
license = "MIT"
publish = false
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sieve_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sieve-core = { path = "../crates/sieve-core" }
managesieve = { version = "0.1.0", path = "../crates/managesieve" }
keyring-core = "1.0.1"
sha2 = "0.10.9"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync"] }
mailstore = { version = "0.1.0", path = "../crates/mailstore" }

# The OS keychain per platform (see accounts.rs). On Linux and the BSDs the
# Secret Service through the system's libdbus, which WebKitGTK needs anyway.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
