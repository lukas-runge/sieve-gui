[input]
# The whole repository, so that types from crates/* used by commands are found.
source_dir = "."
exclude = [
    "node_modules",
    ".svelte-kit",
    "build",
    "tests",
    "target",
]
use_cargo_expand = false

[output]
types_file = "src/generated/tauri/types.ts"
commands_file = "src/generated/tauri/commands.ts"

[naming]
type_prefix = ""
type_suffix = ""
function_prefix = ""
function_suffix = ""
